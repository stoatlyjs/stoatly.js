name: Notify
on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send embed webhook
        run: |
          PAYLOAD=$(jq -n \
            --arg title "New push to ${{ github.repository }}" \
            --arg desc "${{ github.event.head_commit.message }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --arg actor "${{ github.actor }}" \
            --arg avatar "https://github.com/${{ github.actor }}.png" \
            --arg branch "${{ github.ref_name }}" \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 3066993,
                author: { name: $actor, icon_url: $avatar },
                fields: [
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: ($sha[0:7]), inline: true }
                ],
                footer: { text: $repo },
                timestamp: (now | todate)
              }]
            }')
          curl -X POST "${{ secrets.STOAT_WEBHOOK }}" -H "Content-Type: application/json" -d "$PAYLOAD"