name: Notify
on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send embed webhook
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          DESC="${COMMIT_MSG}

          Branch: ${BRANCH}
          Commit: ${SHORT_SHA}"

          PAYLOAD=$(jq -n \
            --arg title "New push to ${REPO}" \
            --arg desc "$DESC" \
            --arg url "$COMMIT_URL" \
            --arg icon "https://github.com/${ACTOR}.png" \
            --arg colour "#2ECC71" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                icon_url: $icon,
                colour: $colour
              }]
            }')
          curl -X POST "${{ secrets.STOAT_WEBHOOK }}" -H "Content-Type: application/json" -d "$PAYLOAD"