name: Notify
on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send embed webhook
        run: |
          PAYLOAD=$(jq -n \
            --arg title "New push to ${{ github.repository }}" \
            --arg desc "${{ github.event.head_commit.message }}\n\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --arg icon "https://github.com/${{ github.actor }}.png" \
            --arg colour "#2ECC71" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                icon_url: $icon,
                colour: $colour
              }]
            }')
          curl -X POST "${{ secrets.STOAT_WEBHOOK }}" -H "Content-Type: application/json" -d "$PAYLOAD"